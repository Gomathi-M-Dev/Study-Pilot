<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/sign-up.css">
</head>

<body>

    <div class="card">


        <!-- Title -->
        <div class="card-title">Create Account</div>
        <div class="card-sub">Join StudyPilot and start your learning journey!</div>

        <!-- Name Row -->
        <div class="name-row">
            <div class="field">
                <label>First Name</label>
                <div class="input-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <input type="text" placeholder="First name" id="First-Name">
                </div>
                <small id="fname-error"></small>
            </div>

            <div class="field">
                <label>Last Name</label>
                <div class="input-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <input type="text" placeholder="Last name" id="Last-Name">
                </div>
                <small id="lname-error"></small>
            </div>
        </div>

        <!-- Email -->
        <div class="field">
            <label>Email</label>
            <div class="input-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="4" />
                    <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94" />
                </svg>
                <input type="email" placeholder="Enter your Email" id="email">
            </div>
            <small id="email-error"></small>
        </div>

        <!-- Password -->
        <div class="field">
            <label>Password</label>
            <div class="input-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <input type="password" placeholder="Create a Password" id="password">
            </div>
            <small id="password-error"></small>
            <div class="strength-bars">
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
            </div>
            <div class="strength-hint">Use 8+ characters with letters & numbers</div>
        </div>

        <!-- Confirm Password -->
        <div class="field">
            <label>Confirm Password</label>
            <div class="input-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <input type="password" placeholder="Confirm your Password" id="Confirm-Password">
            </div>
        </div>

        <!-- Terms -->
        <div class="terms-row">
            <input type="checkbox" id="terms">
            <label for="terms">
                I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
            </label>
        </div>

        <!-- Sign Up Button -->
        <button class="signup-btn" id="sign-up">Sign Up</button>

        <!-- Login Link -->
        <div class="login-link">
            Already have an account? <a href="login.html">Sign In</a>
        </div>

        <!-- Divider -->
        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">Or With</span>
            <div class="divider-line"></div>
        </div>

        <!-- Social Buttons -->
        <div class="social-row">
            <button class="social-btn" id="google-btn">
                <!-- Google SVG -->
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                Google
            </button>
            <button class="social-btn" id="ms-btn">
                <!-- Microsoft SVG -->
                <svg class="google-icon" viewBox="0 0 24 24">
                    <rect x="1" y="1" width="10" height="10" fill="#F25022" />
                    <rect x="13" y="1" width="10" height="10" fill="#7FBA00" />
                    <rect x="1" y="13" width="10" height="10" fill="#00A4EF" />
                    <rect x="13" y="13" width="10" height="10" fill="#FFB900" />
                </svg>
                Microsoft
            </button>

        </div>

    </div>
    <script src="JS/sign-up.js"></script>
    <script type="module">
        // 1. Ella tools-aiyum ORE ORE thadava import pannu
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-analytics.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, OAuthProvider } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD8cYD1SRj4DseGdWiJtv8k7XXVZp8GoiQ",
            authDomain: "study-pilot-d6fef.firebaseapp.com",
            projectId: "study-pilot-d6fef",
            storageBucket: "study-pilot-d6fef.firebasestorage.app",
            messagingSenderId: "652015560760",
            appId: "1:652015560760:web:1ccc4834c3c21206755ecd",
            measurementId: "G-X7K93CRFX0"
        };

        // 2. Initialize
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app); // Ithu ORE thadava thaan irukkanum

        // 3. Providers
        const googleProvider = new GoogleAuthProvider();
        const msProvider = new OAuthProvider('microsoft.com');

        // 4. Google Login Event
        document.getElementById("google-btn").addEventListener("click", async (event) => {
            event.preventDefault();
            try {
                const result = await signInWithPopup(auth, googleProvider);
                console.log("Google Success:", result.user.displayName);
                setTimeout(() => { window.location.href = "index.html"; }, 300);
            } catch (error) {
                console.error("Error:", error);
            }
        });

        // 5. Microsoft Login Event
        document.getElementById("ms-btn").addEventListener("click", async (event) => {
            event.preventDefault();
            try {
                const result = await signInWithPopup(auth, msProvider);
                console.log("Microsoft Success:", result.user.displayName);
                window.location.href = "index.html";
            } catch (error) {
                console.error("Microsoft Error:", error);
            }
        });
    </script>
</body>

</html>
